include:
  - ".well-known"

exclude:
  - "/vendor/"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "LICENSE.md"
  - "*.gemspec"

keep_files:
  - "CNAME"
  - ".git"
  - ".gitignore"


# Site settings
title: Cyril Fougeray | Embedded Software Engineer
# No more than 155 characters for meta description
meta_desc: Embedded software engineer building dependable connected products, from firmware and RTOS to device integration and production systems.
subtitle: "Embedded Software Engineer"
url: https://www.cyrilfougeray.com # the base hostname & protocol for your site
# baseurl: "/the/subpath/of/your/site" # Set this value to "" if you want your site to be root
baseurl: ""
cover: "/assets/cover.png"
logo: "/assets/logo.png"
twitter_username: cyrilfougeray
github_username:  fouge

# Build settings
markdown: kramdown

future: true

# Google analytics
ga_tracking_id: "UA-160868445-1"

# Category descriptions (for archive pages)
descriptions:
  - cat: misc
    desc: "Miscellaneous posts"

  - cat: CI
    desc: "Continuous Integration"

  - cat: Debugging
    desc: "Debugging related posts"
