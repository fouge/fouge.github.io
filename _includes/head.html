<script>
  window.addEventListener('DOMContentLoaded', function() {
    var twitterShare = document.getElementById('twitter_share');
    var linkedinShare = document.getElementById('linkedin_share');
    var shareButton = document.getElementById('share_btn');

    if (twitterShare) {
      twitterShare.href = 'https://twitter.com/share?text="{{ page.title }}"%20by%20@cyrilfougeray%20' + encodeURIComponent(location.href);
    }

    if (linkedinShare) {
      linkedinShare.href = 'https://www.linkedin.com/shareArticle?url=' + encodeURIComponent(location.href);
    }

    if (navigator.share && shareButton) {
      shareButton.addEventListener('click', function() {
        navigator.share({
          url: location.href,
          title: '{{ page.title }}'
        });
      });
    }
  });
</script>
