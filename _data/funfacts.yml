- icon: ion-planet
  text: I visited around 25 countries during the last decade. <br/>Counting one 11-month world tour with my girlfriend 👫. <br/>To know everything about that trip, checkout <a href="https://www.polarsteps.com/c2tosee">our Polarstep </a>(🇫🇷)
- icon: ion-home
  text: I moved 11 times in 7 cities during the last decade. I am now close to the french city of Nantes for an unlimited amount of time. <br/>Between schools and internships, I discovered many parts of France and even San Francisco in the US.
- icon: ion-cash
  text: I became interested in cryptocurrencies in 2017 through the technology. That curiosity now shows up in <a href="https://vertices.network/sdk/">Vertices</a>, where I explore how connected devices can create trustworthy evidence and interact with digital services.
- icon: ion-network
  text: I believe the next generation of connected products will need to prove who they are and what they observed.<br/>I am exploring that idea in public through the <a href="https://github.com/vertices-network/vertices-sdk">Vertices SDK</a>.
- icon: ion-headphone
  text: I listen to podcasts regularly. <br/>My preferences are <a href="https://www.gdiy.fr/">Generation Do It Yourself</a> and <a href="https://lamartingale.io/">La Martingale</a> (all 🇫🇷).
- icon: ion-heart
  text: I track my heart rate at night. <br/>It's an important indicator of my health, and I can tell you that drinking an alcoholic drink increases my HR by at least 10% during the following night. Same as sleeping at 4000m over the sea level...
- icon: ion-android-bicycle
  text: I do biking. <a href="https://www.strava.com/athletes/19658135">Follow-me</a> on Strava.
- icon: ion-music-note
  text: I love music festivals. I love music, I love being with friends 🎉.
